services:
  showroom-ssr-1:
    build:
      context: .
      target: ssr
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:root@host.docker.internal:5432/postgres?schema=showroom}

  showroom-ssr-2:
    build:
      context: .
      target: ssr
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:root@host.docker.internal:5432/postgres?schema=showroom}

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - showroom-ssr-1
      - showroom-ssr-2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
