services:
  showroom-ssr-1:
    build:
      context: .
      target: ssr
    environment:
      PORT: 4000

  showroom-ssr-2:
    build:
      context: .
      target: ssr
    environment:
      PORT: 4000

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - showroom-ssr-1
      - showroom-ssr-2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
